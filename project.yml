# XcodeGen manifest — the source of truth for the Xcode app target.
# Regenerate the.xcodeproj with:  xcodegen generate
# (The.xcodeproj is gitignored; this file is what's version-controlled.)
name: NextTyped

options:
  bundleIdPrefix: com.robinklotz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""        # ← set your Apple Developer Team ID for signing/notarization

packages:
  NextTypedCore:
    path: NextTypedCore       # local SPM package (pure, tested logic)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.5.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  # MLX on-device inference. The LLM Swift libs (MLXLLM / MLXLMCommon / MLXHuggingFace) live in
  # ml-explore/mlx-swift-lm — NOT mlx-swift-examples (which now ships only StableDiffusion/MNIST).
  # mlx-swift-lm pins mlx-swift to 0.31.x; we depend on mlx-swift directly only to `import MLX`.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.3"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: "0.31.4"
  # mlx-swift-lm's MLXHuggingFace macros expand to code that references HubClient/HuggingFace and
  # Tokenizers — the app must supply those backends itself (mlx-swift-lm deliberately doesn't depend
  # on them). Per the mlx-swift-lm README's SPM setup:
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.3.0"

targets:
  NextTyped:
    type: application
    platform: macOS
    sources:
      - App
      # The uninstall guide ships in the bundle, so it works offline.
      - path: docs/uninstall.md
        buildPhase: resources
      # The compatibility list ships in the bundle for the same reason.
      - path: docs/compatibility.md
        buildPhase: resources
    info:
      path: App/Info.plist        # generated by XcodeGen (gitignored)
      properties:
        LSUIElement: true          # menu-bar agent, no Dock icon
        CFBundleURLTypes:          # nexttyped://settings[/<pane>] 
          - CFBundleURLName: com.robinklotz.NextTyped
            CFBundleURLSchemes: [nexttyped]
        CFBundleDisplayName: NextTyped
        # Sparkle. Both values are placeholders until the maintainer creates
        # robin1333k/NextTyped-releases and runs `generate_keys`; neither repo nor key exists yet.
        SUFeedURL: https://robin1333k.github.io/NextTyped-releases/appcast.xml
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableSystemProfiling: false     # no system profile in the request
        # SUEnableAutomaticChecks stays unset: Sparkle asks on the second launch. Interval: its default, one day.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    entitlements:
      path: App/NextTyped.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robinklotz.NextTyped
        # 32 zero bytes: a well-formed key nothing was signed with, so no update verifies. The real key
        # replaces it when the maintainer generates one.
        SPARKLE_PUBLIC_ED_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
        # App/Resources/Assets.xcassets: AppIcon and the menu bar template glyph (scripts/make-icon.py draws both).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # OFF for local dev: Hardened Runtime's Library Validation requires every
        # loaded dylib to share the app's Team ID, which our Team-ID-less self-signed
        # cert can't satisfy — the app aborts at launch ("different Team IDs"). Turn
        # back ON for a notarized release (with a real Apple Team).
        ENABLE_HARDENED_RUNTIME: NO
        # Local dev: sign with a STABLE self-signed cert so the signature doesn't
        # change every rebuild — that's what makes macOS remember Accessibility /
        # Input Monitoring grants. (See README "Local signing".) For a notarized
        # release this becomes Automatic + a real Team.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "NextTyped Dev"
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - package: NextTypedCore
        product: NextTypedCore
      - package: Sparkle
      - package: KeyboardShortcuts
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: mlx-swift
        product: MLX
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers

  NextTypedTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AppTests
      # Compiled in, not reached through the app: the bundle has no test host, so `xcodebuild test`
      # never launches NextTyped (with its event tap) while the developer works.
      - App/Prediction/PrefillLastLogits.swift
      - App/Support/AppSettingsStore.swift
      - App/Personalization/PersonalizationSettings.swift
      - App/ScreenContext/ScreenOCRSettings.swift
      - App/Harness/HarnessEnvironment.swift
      - App/Logging.swift
      - App/Support/DiagnosticsTallyHub.swift
    settings:
      base:
        # Let Xcode synthesise the test bundle's Info.plist — without it `xcodebuild test` can't code-sign
        # the bundle ("target does not have an Info.plist file"). Needed to RUN the MLX-backed
        # SnapshotReuseDetachTests locally.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.robinklotz.NextTypedTests
    dependencies:
      # A tiny random Qwen3.5 model for SplitPrefillTests, and PrefillShape.
      - package: mlx-swift-lm
        product: MLXLLM
      - package: NextTypedCore
        product: NextTypedCore
      # MLX cache primitives for the snapshot `copy()`+`eval` detach test
      # (SnapshotReuseDetachTests) — the test exercises KVCacheSimple/MambaCache directly.
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift
        product: MLX
